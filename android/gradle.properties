# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx1536m -Djava.net.preferIPv4Stack=true -Dsun.net.client.defaultConnectTimeout=60000 -Dsun.net.client.defaultReadTimeout=60000

# Force TLS version for connections
systemProp.https.protocols=TLSv1.2,TLSv1.3

# Disable daemon to avoid potential socket issues during initial download
org.gradle.daemon=false

android.useAndroidX=true
